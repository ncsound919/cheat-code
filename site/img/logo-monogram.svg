<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cheat Code monogram">
  <defs>
    <linearGradient id="court" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182333"/>
      <stop offset="1" stop-color="#0B1018"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#court)"/>
  <rect width="512" height="512" rx="116" fill="none" stroke="#263247" stroke-width="3"/>

  <!-- two interlocking C's: aqua (Over) and amber (Under) -->
  <path d="M 288 152 A 104 104 0 1 0 288 360" fill="none" stroke="#58C7E6" stroke-width="34"
        stroke-linecap="round"/>
  <path d="M 224 152 A 104 104 0 1 1 224 360" fill="none" stroke="#F0A54B" stroke-width="34"
        stroke-linecap="round" opacity="0.92"/>

  <!-- center dot = the edge -->
  <circle cx="256" cy="256" r="11" fill="#6FD3A0"/>
</svg>
